<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - CubeFactory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-wrapper">
    <div class="auth-card">
      
      <!-- Left Column: Sign In Form -->
      <section class="auth-form-column">
        <!-- Brand Logo -->
        <header class="brand">
          <svg class="brand-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="14" cy="14" r="11" stroke="currentColor" stroke-width="2"/>
            <path d="M7 11.5C9.5 9 18.5 9 21 11.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M7 16.5C9.5 19 18.5 19 21 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M14 3.5V24.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="brand-name">CubeFactory</span>
        </header>

        <!-- Form Intro -->
        <div class="form-header">
          <h1 class="form-title">Welcome back</h1>
          <p class="form-subtitle">Please enter your details</p>
        </div>

      <!-- Social Login Button -->
      <button type="button" class="btn-social" id="google-signin-btn">
        <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <span>Sign in with Google</span>
      </button>

        <!-- Divider -->
        <div class="divider">
          <span class="divider-line"></span>
          <span class="divider-text">or</span>
          <span class="divider-line"></span>
        </div>

        <!-- Main Form -->
        <form id="signin-form" novalidate>
          <!-- Email Field -->
          <div class="field-group" id="email-group">
            <label for="email" class="field-label">Email address</label>
            <div class="input-container">
              <input type="email" id="email" name="email" class="form-input" autocomplete="email" required>
              <span class="validation-icon" aria-hidden="true"><span class="validation-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
              </span>
            </div>
            <p class="field-message error-message" id="email-error">Please enter a valid email address</p>
          </div>

          <!-- Password Field -->
          <div class="field-group" id="password-group">
            <label for="password" class="field-label">Password</label>
            <div class="input-container">
              <input type="password" id="password" name="password" class="form-input" autocomplete="current-password" required>
              <span class="validation-icon" aria-hidden="true"><span class="validation-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
              </span>
            </div>
            <p class="field-message error-message" id="password-error">Your password must contain only numbers</p>
          </div>

          <!-- Options Row -->
          <div class="form-options">
            <label class="checkbox-control">
              <input type="checkbox" id="remember" name="remember">
              <span class="checkbox-label">Remember for 30 days</span>
            </label>
            <a href="#" class="link-subtle">Forgot password</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-primary" id="signin-submit-btn">
            Sign in
          </button>
        </form>

        <!-- Switch to Sign Up -->
        <footer class="form-footer">
          <p>Don't have an account? <a href="signup.html" class="link-action">Sign up</a></p>
        </footer>
      </section>

      <!-- Right Column: Visual Hero Banner -->
      <section class="auth-hero-column" aria-label="Welcome banner">
        <div class="hero-image-wrapper">
          <img src="https://images.pexels.com/photos/30538798/pexels-photo-30538798.jpeg" alt="Young woman with delicate purple flowers" class="hero-image">
          <div class="hero-overlay"></div>
        </div>
        <div class="hero-content">
          <h2 class="hero-heading">Bring your ideas to life.</h2>
          <p class="hero-description">Sign up for free and enjoy access to all features for 30 days. No credit card required.</p>
        </div>
      </section>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
